name: CI (mirome)

on:
  push:
    branches: [main]
    paths: ["mirome/**", ".github/workflows/mirome-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["mirome/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mirome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mirome/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
