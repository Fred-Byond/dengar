<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Authority</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@300;400;500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Knowledge Authority — the governance console.

   Deliberately not any vertical's brand. Beauty Intelligence §3.4 argues the
   governance workspace must be visibly separate from operations — different
   people, different risk, auditability — so it does not borrow the look of
   the products it governs.
   ═════════════════════════════════════════════════════════════════════ */
:root{
  --ground:#FBFAF8; --surface:#FFFFFF; --surface-2:#F4F2ED;
  --line:#E3DFD7; --line-soft:#EFECE6;
  --ink:#15171B; --ink-2:#3D424A; --ink-3:#6B7079; --ink-4:#93979E;
  --accent:#B0632F; --accent-soft:#F8EDE4;
  --pass:#2F7A5E; --fail:#A8402F; --warn:#8A6A22; --idle:#93979E;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#101216; --surface:#171A1F; --surface-2:#1E2228;
    --line:#2B3038; --line-soft:#22262D;
    --ink:#EDECE9; --ink-2:#C2C6CC; --ink-3:#8E949D; --ink-4:#6A7079;
    --accent:#D98A50; --accent-soft:#2A211A;
    --pass:#6FBF9A; --fail:#E08268; --warn:#D6AE5C; --idle:#6A7079;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink-2);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ── Sign in ─────────────────────────────────────────────────────────── */
.signin{min-height:100dvh;display:grid;place-items:center;padding:24px}
.signinCard{
  width:min(430px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:4px;padding:34px 32px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 40px -30px rgba(0,0,0,.5);
}
.wordmark{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mark{width:22px;height:22px;border-radius:3px;background:linear-gradient(135deg,var(--accent) 0%,#6A57B8 100%);flex:none}
.wordmarkText{font-size:15px;font-weight:700;letter-spacing:.14em;color:var(--ink);text-transform:uppercase}
.signinCard h1{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.2;color:var(--ink);margin:0}
.signinCard p{margin:0;font-size:13.5px;color:var(--ink-3);line-height:1.55}

/* ── Shell ───────────────────────────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;gap:14px;padding:12px 22px;
  border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;
  position:sticky;top:0;z-index:10;
}
.spacer{flex:1}
/* Beauty §3.4: a workspace SWITCH, not a menu item. */
.wsSwitch{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.wsBtn{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 13px;background:var(--surface);color:var(--ink-3);border:0;
}
.wsBtn.on{background:var(--accent);color:#fff}
.who{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);text-align:right;line-height:1.5}
.who b{color:var(--ink);font-weight:600}

.body{display:grid;grid-template-columns:236px 1fr;min-height:calc(100dvh - 50px)}
@media (max-width:880px){
  .body{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
}
.side{
  border-right:1px solid var(--line);background:var(--surface-2);
  padding:20px 16px;display:flex;flex-direction:column;gap:22px;
}
.sideGroup{display:flex;flex-direction:column;gap:7px}
.sideLabel{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:2px;
}
.vBtn{
  display:flex;align-items:flex-start;gap:9px;padding:10px 11px;
  border:1px solid var(--line);border-radius:3px;background:var(--surface);
  text-align:left;width:100%;
}
.vBtn.on{border-color:var(--accent);background:var(--accent-soft)}
.vDot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}
.vName{display:block;font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}
.vMeta{display:block;font-size:10.5px;color:var(--ink-4);line-height:1.4;margin-top:2px}
.navBtn{
  padding:8px 11px;border:0;border-radius:3px;background:none;text-align:left;
  font-size:13px;color:var(--ink-2);width:100%;
}
.navBtn.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.doctrine{font-size:12px;color:var(--ink-3);line-height:1.55}

.main{padding:26px 28px 90px;min-width:0}
.pageHead{
  display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;
  margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line-soft);
}
.pageHead h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15;color:var(--ink);margin:0}
.pageHead p{margin:5px 0 0;font-size:13px;color:var(--ink-3);max-width:62ch;line-height:1.55}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}

/* ── Controls ────────────────────────────────────────────────────────── */
.btn{
  font-size:13px;font-weight:600;padding:9px 16px;border-radius:3px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;
}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.btnRow{display:flex;gap:9px;flex-wrap:wrap}
.input{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;
  background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:14px;
}
.field{display:flex;flex-direction:column;gap:6px}
.field label{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);
}

/* ── Stats ───────────────────────────────────────────────────────────── */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:3px;
  overflow:hidden;margin-bottom:22px;
}
.stat{background:var(--surface);padding:14px 16px}
.statN{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.statL{font-size:11.5px;color:var(--ink-4);margin-top:2px;line-height:1.4}

/* ── Table ───────────────────────────────────────────────────────────── */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
th{
  text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-4);font-weight:500;padding:11px 14px;
  border-bottom:1px solid var(--line);background:var(--surface-2);
}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink-2);line-height:1.45}
tr:last-child td{border-bottom:0}
.rowBtn{background:none;border:0;padding:0;font-size:13px;color:var(--ink);font-weight:600;text-align:left}
.rowBtn:hover{color:var(--accent)}
.mono{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* ── Chips ───────────────────────────────────────────────────────────── */
.chip{
  display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid currentColor;white-space:nowrap;
}
.c-draft{color:var(--idle)} .c-review{color:var(--warn)} .c-approved{color:var(--accent)}
.c-effective{color:var(--pass)} .c-retired{color:var(--fail)}
.kindChip{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);letter-spacing:.06em}

/* ── Gate report ─────────────────────────────────────────────────────── */
.verdictBar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 20px;
  border:1px solid var(--line);border-left:3px solid var(--fail);border-radius:3px;
  background:var(--surface);margin-bottom:20px;
}
.verdictBar.ok{border-left-color:var(--pass)}
.verdictText{font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1.25}
.verdictSub{font-size:12.5px;color:var(--ink-3);line-height:1.5;width:100%}
.gateList{display:flex;flex-direction:column;gap:10px}
.gate{border:1px solid var(--line);border-radius:3px;background:var(--surface);overflow:hidden}
.gateHead{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center;padding:13px 16px}
@media (max-width:620px){.gateHead{grid-template-columns:72px 1fr}}
.gateMark{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 0;text-align:center;border-radius:2px;border:1px solid currentColor;
}
.m-pass{color:var(--pass)} .m-hard{color:var(--fail)} .m-adv{color:var(--warn)} .m-na{color:var(--idle)}
.gateName{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.gateAsserts{display:block;font-size:12px;color:var(--ink-4);line-height:1.45;margin-top:2px}
.gateCount{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);white-space:nowrap}
.findings{border-top:1px solid var(--line-soft);background:var(--surface-2);padding:4px 0}
.finding{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:9px 16px;font-size:12.5px;line-height:1.5}
@media (max-width:620px){.finding{grid-template-columns:1fr;gap:3px}}
.fSubject{font-family:var(--mono);font-size:11px;color:var(--accent);word-break:break-word}

/* ── Detail ──────────────────────────────────────────────────────────── */
.detail{
  border:1px solid var(--line);border-radius:3px;background:var(--surface);
  padding:22px 24px;display:flex;flex-direction:column;gap:18px;margin-bottom:20px;
}
.detail h3{font-size:17px;color:var(--ink);margin:0 0 4px;line-height:1.3}
.kv{display:grid;grid-template-columns:172px 1fr;gap:10px 16px;font-size:13px;margin:0}
@media (max-width:620px){.kv{grid-template-columns:1fr;gap:2px 0}.kv dt{margin-top:10px}}
.kv dt{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-4);padding-top:2px;
}
.kv dd{margin:0;color:var(--ink-2);line-height:1.5}
.chain{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chainStep{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:4px 8px;
  border-radius:2px;border:1px solid var(--line);color:var(--ink-4);
}
.chainStep.done{border-color:var(--pass);color:var(--pass)}
.chainStep.now{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chainArrow{color:var(--ink-4);font-size:10px}

.note{
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;
  background:var(--accent-soft);padding:15px 18px;font-size:12.5px;line-height:1.6;color:var(--ink-2);
}
.note b{color:var(--ink)}
.empty{
  padding:40px 20px;text-align:center;color:var(--ink-4);font-size:13px;
  border:1px dashed var(--line);border-radius:3px;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ── Sign in ──────────────────────────────────────────────────────── -->
<div class="signin" id="signin">
  <div class="signinCard">
    <div class="wordmark">
      <span class="mark"></span>
      <span class="wordmarkText">Knowledge Authority</span>
    </div>
    <h1>Sign in to the governance workspace.</h1>
    <p>
      Your role decides what you can approve. It is recorded on every object you
      advance, and your name is recorded on every release you sign — never the
      other way round.
    </p>
    <div class="field">
      <label for="nm">Name</label>
      <input id="nm" class="input" type="text" value="Fred Chong">
    </div>
    <div class="field">
      <label for="rl">Role</label>
      <select id="rl" class="input">
        <option value="role:domain_reviewer">Domain reviewer</option>
        <option value="role:legal_reviewer">Legal reviewer</option>
        <option value="role:safety_reviewer">Safety reviewer</option>
        <option value="role:regulatory_approver">Regulatory approver</option>
        <option value="role:platform_admin">Platform admin (BYOND)</option>
      </select>
    </div>
    <button class="btn" id="enterBtn">Enter workspace</button>
  </div>
</div>

<!-- ── Shell ────────────────────────────────────────────────────────── -->
<div id="shell" class="hidden">
  <div class="topbar">
    <div class="wordmark">
      <span class="mark"></span>
      <span class="wordmarkText">Knowledge Authority</span>
    </div>
    <div class="wsSwitch">
      <button class="wsBtn on" data-ws="authority">Governance</button>
      <button class="wsBtn" data-ws="operations">Operations</button>
    </div>
    <span class="spacer"></span>
    <div class="who"><b id="whoName">—</b><br><span id="whoRole">—</span></div>
    <button class="btn ghost" id="signOut">Sign out</button>
  </div>

  <div class="body">
    <aside class="side">
      <div class="sideGroup">
        <span class="sideLabel">Vertical</span>
        <div id="verticalList"></div>
      </div>
      <div class="sideGroup" id="navGroup">
        <span class="sideLabel">Workspace</span>
        <button class="navBtn on" data-panel="library">Object library</button>
        <button class="navBtn" data-panel="gate">Publish gate</button>
        <button class="navBtn" data-panel="releases">Release ledger</button>
      </div>
      <div class="sideGroup">
        <span class="sideLabel">Doctrine</span>
        <div class="doctrine" id="doctrine"></div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>

/* ═══════════════════════════════════════════════════════════════════════
   THE ENGINE — generated from src/lib/console and src/lib/auren.

   Do not hand-edit between the markers: run `npm run console`. The schema,
   the seeded libraries and the nine-test publish gate below are the SAME CODE
   the /console route runs, so the prototype and the product cannot disagree
   about whether a bundle is releasable.
   ═════════════════════════════════════════════════════════════════════ */

/* AUREN-CONSOLE-START — generated by scripts/build-console-prototype.mjs */
/* ── lib/console/schema.js ─────────────────────────────────── */
/**
 * Knowledge Authority — the unified object schema.
 *
 * Reconciles three specifications that independently arrived at the same
 * architecture:
 *
 *   AUREN Paper III v1.1        — Scam + Competency objects, mode eligibility
 *   Project Pioneer Paper IV    — Offence objects, eight-state lifecycle,
 *                                 leading-risk control, language fidelity gate
 *   Beauty Intelligence         — Claim objects, market scope, publish gate
 *
 * Where they disagree, the resolution is recorded at the field. There are four
 * such places and each one is a fork if it is decided wrongly, so they are
 * settled in the schema rather than in a convention document.
 */
const STATUS_CHAIN = [
    "DRAFT",
    "LEGAL_REVIEW",
    "TERMINOLOGY_PASS",
    "FIDELITY_PASS",
    "APPROVED",
    "EFFECTIVE",
];
/** Only EFFECTIVE objects are loadable at runtime. */
function isLoadable(status) {
    return status === "EFFECTIVE";
}
function nextStatus(status) {
    const i = STATUS_CHAIN.indexOf(status);
    if (i === -1 || i === STATUS_CHAIN.length - 1)
        return null;
    return STATUS_CHAIN[i + 1];
}

/* ── lib/auren/objects.js ─────────────────────────────────── */
/**
 * AUREN — the frozen knowledge-object inventory.
 *
 * Source of truth: "AUREN — The Intelligent Investor Interview & Coaching
 * Engine" (Paper III v1.1) and "AUREN — The Product Experience & Build
 * Specification" (Paper IV v1.0).
 *
 * Governing rule (Paper III, Rule 1 and Rule 2): every string that can reach a
 * learner and contribute to a determination is a versioned OBJECT, not prose
 * written inline at a call site. Ontology is populated as DATA — never as code.
 * Adding a scam typology must never require a component change.
 *
 * Mode eligibility (Rule 3) is declared per object and enforced by the session
 * machine, not by prompt discipline: a Challenge object can never fire outside
 * REHEARSE.
 *
 * LANGUAGE (Paper III §6.3, §10.2): a Question object carries "language
 * variants with fidelity status", and the learner's language is a first-class
 * dimension of every scored determination. So the localized fields below are
 * not translations of a UI — they are variants of the governed object, and that
 * includes `satisfactionCues`. A Spanish answer must be evaluated against
 * Spanish cues, or the element silently fails for every non-English learner.
 */

/* ── lib/console/gate.js ─────────────────────────────────── */
/**
 * The publish gate.
 *
 * Generalised from Beauty Intelligence §3.3 (eight tests, four hard) across
 * all three papers, and extended by the Candidate-set test that the first run
 * proved was missing. Ten tests, seven of them hard.
 *
 * Beauty's framing is the one that matters and it is carried verbatim into
 * the implementation: "The gate is not a report generated after release; it is
 * the condition of release." A hard failure blocks publication and shows the
 * failing probe, what the system did, and why it failed — to the person who
 * has to fix it.
 *
 * Four of the hard gates bind BYOND contractually as well as the client, per
 * the same paper. Nothing in this module offers a waive path, deliberately.
 */

function result(id, name, severity, asserts, checked, findings) {
    return {
        id,
        name,
        severity,
        asserts,
        checked,
        findings,
        assessed: checked > 0,
        passed: checked > 0 && findings.length === 0,
    };
}
/**
 * Run the gate against a candidate library.
 *
 * The candidate set is what WOULD be released — every object that has reached
 * EFFECTIVE. Objects still in review are not failures; they are simply not in
 * the bundle, and the coverage test is what notices when their absence leaves
 * a hole.
 */
function runGate(pack, objects) {
    const effective = objects.filter((o) => isLoadable(o.governance.status));
    const byId = new Map(objects.map((o) => [o.id, o]));
    const elements = effective.filter((o) => o.kind === "element");
    const questions = effective.filter((o) => o.kind === "question");
    const challenges = effective.filter((o) => o.kind === "challenge");
    const signatures = effective.filter((o) => o.kind === "signature");
    const boundaries = effective.filter((o) => o.kind === "boundary");
    const results = [];
    /* ── 0. Candidate set ────────────────────────────────────────────────
       Nothing below means anything against an empty bundle. Reported first
       and as a hard failure so a library that has never been approved cannot
       present itself as nine passing tests. */
    results.push(result("candidate", "Candidate set", "hard", "At least one object has reached EFFECTIVE and is in the bundle.", objects.length, effective.length === 0
        ? [{
                subject: pack.id,
                detail: `${objects.length} objects authored, none EFFECTIVE. Nothing would be released, and every test below is unassessed rather than passing.`,
            }]
        : []));
    /* ── 1. Coverage ─────────────────────────────────────────────────────
       Every mandatory element must have at least one eligible question that
       can elicit it. An element with no question is an element the system
       will never resolve — Pioneer's distinction between "not capturable"
       (legitimate) and "not asked" (a defect) is honoured here. */
    {
        const targeted = new Set(questions.map((q) => (q.kind === "question" ? q.targetElement : "")));
        const findings = [];
        for (const el of elements) {
            if (el.kind !== "element")
                continue;
            if (!el.mandatory || !el.capturable)
                continue;
            if (!targeted.has(el.id)) {
                findings.push({
                    subject: el.id,
                    detail: `Mandatory element "${el.label}" has no question that can elicit it. It can never be resolved in a session.`,
                });
            }
        }
        results.push(result("coverage", "Coverage", "hard", "Every mandatory, capturable element has at least one eligible question.", elements.length, findings));
    }
    /* ── 2. Anchor integrity ─────────────────────────────────────────────
       No anchor, no deployment. The rule is already absolute in AUREN §10.1
       and Pioneer's Legal Source requirement; Beauty's equivalent is the
       regulatory position on a claim. */
    {
        const findings = [];
        for (const el of elements) {
            if (el.kind !== "element")
                continue;
            if (!el.authorityAnchor.trim()) {
                findings.push({
                    subject: el.id,
                    detail: `"${el.label}" carries no authority anchor. ${pack.anchorAuthority} is the required source.`,
                });
            }
        }
        results.push(result("anchor", "Anchor integrity", "hard", "Every element binds to a published clause in the vertical's anchor authority.", elements.length, findings));
    }
    /* ── 3. Prohibited formulation ───────────────────────────────────────
       Pioneer: medium leading-risk requires a written rationale; high is
       prohibited outright. AUREN: no ladder step may exceed its ceiling, and
       pressure always carries a distress exit. Beauty: no released wording may
       match a forbidden phrasing, in any language. */
    {
        const findings = [];
        for (const q of questions) {
            if (q.kind !== "question")
                continue;
            if (q.leadingRisk === "medium" && !q.leadingRiskRationale) {
                findings.push({
                    subject: q.id,
                    detail: "Medium leading-risk without a written rationale from a legal reviewer.",
                });
            }
        }
        for (const c of challenges) {
            if (c.kind !== "challenge")
                continue;
            if (c.ladderSteps > c.ladderCeiling) {
                findings.push({
                    subject: c.id,
                    detail: `Escalation ladder has ${c.ladderSteps} steps against a ceiling of ${c.ladderCeiling}.`,
                });
            }
            if (!c.distressExit) {
                findings.push({
                    subject: c.id,
                    detail: "Pressure is applied with no distress exit. Non-negotiable in every paper.",
                });
            }
        }
        // Beauty's test: a forbidden phrasing appearing inside a released wording.
        const forbidden = signatures.flatMap((s) => s.kind === "signature" ? s.forbiddenPhrasings.map((p) => ({ p, from: s.id })) : []);
        for (const q of questions) {
            if (q.kind !== "question")
                continue;
            for (const v of q.variants) {
                for (const f of forbidden) {
                    if (v.wording.toLowerCase().includes(f.p.toLowerCase())) {
                        findings.push({
                            subject: `${q.id} · ${v.lang}`,
                            detail: `Released wording contains the forbidden phrasing "${f.p}" (${f.from}).`,
                        });
                    }
                }
            }
        }
        results.push(result("prohibited", "Prohibited formulation", "hard", "No unrationalised leading risk, no ladder above ceiling, no forbidden phrasing in any released wording.", questions.length + challenges.length, findings));
    }
    /* ── 4. Scope integrity ──────────────────────────────────────────────
       The gate that catches a whole class of silent failure. Three checks:
       an object may not declare a mode the vertical does not have; a neutral
       vertical may hold no challenge objects at all; and a question may not be
       released into a market where its target element is not approved. */
    {
        const findings = [];
        const modes = new Set(pack.modes);
        for (const o of effective) {
            for (const m of o.eligibility.modes) {
                if (!modes.has(m)) {
                    findings.push({
                        subject: o.id,
                        detail: `Declares mode "${m}", which this vertical does not define (${pack.modes.join(", ")}).`,
                    });
                }
            }
        }
        if (pack.doctrine === "neutral" && challenges.length > 0) {
            for (const c of challenges) {
                findings.push({
                    subject: c.id,
                    detail: "Challenge object in a neutral-doctrine vertical. Adversarial content is forbidden here.",
                });
            }
        }
        for (const q of questions) {
            if (q.kind !== "question")
                continue;
            const target = byId.get(q.targetElement);
            if (!target)
                continue;
            const targetMarkets = target.eligibility.markets;
            if (targetMarkets.length === 0)
                continue;
            const over = q.eligibility.markets.filter((m) => !targetMarkets.includes(m));
            if (over.length) {
                findings.push({
                    subject: q.id,
                    detail: `Released into ${over.join(", ")} but its target ${target.id} is approved only in ${targetMarkets.join(", ")}.`,
                });
            }
        }
        results.push(result("scope", "Scope integrity", "hard", "No object is reachable outside its declared mode, market or doctrine.", effective.length, findings));
    }
    /* ── 5. Boundary refusal ─────────────────────────────────────────────
       The vertical must declare the question it can never answer, and the
       refusal must hold in every deployed language. Beauty's standard is the
       platform standard: a system that refuses correctly in English and can be
       talked around in Arabic has not passed. */
    {
        const findings = [];
        if (boundaries.length === 0) {
            findings.push({
                subject: pack.id,
                detail: "No boundary object. Every vertical must declare the question it must never answer.",
            });
        }
        for (const b of boundaries) {
            if (b.kind !== "boundary")
                continue;
            const missing = pack.languages.filter((l) => !b.eligibility.languages.includes(l));
            if (missing.length) {
                findings.push({
                    subject: b.id,
                    detail: `Refusal is not proven in ${missing.join(", ")}. It holds in ${b.eligibility.languages.join(", ")} only.`,
                });
            }
            if (b.probes.length < 2) {
                findings.push({
                    subject: b.id,
                    detail: "Fewer than two probes. A boundary tested once is a boundary tested by accident.",
                });
            }
        }
        results.push(result("boundary", "Boundary refusal", "hard", "The vertical's hard boundary is declared and proven in every deployed language.", boundaries.length, findings));
    }
    /* ── 6. Version consistency ──────────────────────────────────────────
       Every reference resolves, and it resolves to something that is actually
       in the bundle. A question pointing at an element still in review is the
       commonest way a library ships broken. */
    {
        const effectiveIds = new Set(effective.map((o) => o.id));
        const findings = [];
        for (const o of effective) {
            const refs = [];
            if (o.kind === "question")
                refs.push(o.targetElement);
            if (o.kind === "challenge")
                refs.push(...o.targetElements);
            if (o.kind === "signature")
                refs.push(o.negatedElement);
            if (o.kind === "question" && o.firesOnlyAfter)
                refs.push(o.firesOnlyAfter);
            for (const r of refs) {
                if (!byId.has(r)) {
                    findings.push({ subject: o.id, detail: `References ${r}, which does not exist.` });
                }
                else if (!effectiveIds.has(r)) {
                    const st = byId.get(r).governance.status;
                    findings.push({
                        subject: o.id,
                        detail: `References ${r}, which is ${st} and will not be in the bundle.`,
                    });
                }
            }
        }
        results.push(result("version", "Version consistency", "hard", "Every reference resolves to an object present in the same bundle.", effective.length, findings));
    }
    /* ── 7. Adversarial probe (advisory) ─────────────────────────────────
       Judgement, not arithmetic — which is why it is advisory. It still finds
       what the other eight cannot: a pressure library with no coverage of the
       elements it claims to test. */
    {
        const findings = [];
        if (pack.doctrine === "dual") {
            const pressured = new Set(challenges.flatMap((c) => (c.kind === "challenge" ? c.targetElements : [])));
            const assessed = elements.filter((e) => e.kind === "element" && e.mandatory);
            const untested = assessed.filter((e) => !pressured.has(e.id));
            if (untested.length) {
                findings.push({
                    subject: pack.id,
                    detail: `${untested.length} of ${assessed.length} mandatory elements are never tested under pressure: ${untested.slice(0, 4).map((e) => e.id).join(", ")}${untested.length > 4 ? "…" : ""}.`,
                });
            }
        }
        results.push(result("adversarial", "Adversarial probe", "advisory", "The released set holds under hostile and leading questioning.", challenges.length, findings));
    }
    /* ── 8. Translation fidelity (advisory) ──────────────────────────────
       Every deployable variant carries the same meaning and the same limits.
       Already implemented and running in AUREN. */
    {
        const findings = [];
        for (const o of effective) {
            if (o.kind !== "question")
                continue;
            for (const lang of pack.languages) {
                const v = o.variants.find((x) => x.lang === lang);
                if (!v || !v.wording.trim()) {
                    findings.push({ subject: `${o.id} · ${lang}`, detail: "No wording for a deployed language." });
                }
                else if (v.fidelity !== "passed") {
                    findings.push({ subject: `${o.id} · ${lang}`, detail: `Fidelity is ${v.fidelity}; only "passed" is deployable.` });
                }
            }
        }
        results.push(result("fidelity", "Translation fidelity", "advisory", "Every deployable variant has passed native review.", questions.length * pack.languages.length, findings));
    }
    /* ── 9. Traceability (advisory) ──────────────────────────────────────
       Every determination resolves to an object, a version and a verbatim span.
       If this fails, nothing else in the system means anything. */
    {
        const findings = [];
        for (const q of questions) {
            if (q.kind !== "question")
                continue;
            if (q.satisfaction === "not_scored")
                continue;
            if (q.satisfaction !== "verbatim_bound" && q.satisfaction !== "entity") {
                findings.push({ subject: q.id, detail: "Contributes to a determination without a binding rule." });
            }
        }
        for (const o of effective) {
            if (!o.governance.effectiveDate) {
                findings.push({ subject: o.id, detail: "EFFECTIVE with no effective date. Not reproducible against a point in time." });
            }
        }
        results.push(result("traceability", "Traceability", "advisory", "Every answer and determination resolves to an object, a version and a verbatim span.", effective.length, findings));
    }
    const hardFailures = results.filter((r) => r.severity === "hard" && r.assessed && !r.passed).length;
    const advisoryFailures = results.filter((r) => r.severity === "advisory" && r.assessed && !r.passed).length;
    const emptyBundle = effective.length === 0;
    return {
        verticalId: pack.id,
        generatedAt: new Date().toISOString(),
        results,
        hardFailures,
        advisoryFailures,
        // An empty bundle is never releasable, however few findings it produced.
        releasable: hardFailures === 0 && !emptyBundle,
        effectiveCount: effective.length,
        totalCount: objects.length,
    };
}

/**
 * Release bundles and the release ledger.
 *
 * A bundle is an immutable, content-addressed snapshot of the EFFECTIVE set.
 * The runtime loads a bundle id and nothing else; rollback is pointing at the
 * previous id. Every session records the bundle it ran on, which is what makes
 * a historical determination reproducible against the knowledge state at the
 * time of capture — Pioneer calls this "a directly court-relevant property".
 *
 * CONFLICT 2, second half. The OBJECT carries an approver role (see ./schema).
 * The RELEASE EVENT carries a named identity, here, in an append-only ledger.
 * Pioneer exports the object register with no individual named in it; Beauty
 * exports the ledger and can answer "who approved this claim, and when".
 */

/**
 * Deterministic content address over the effective set.
 *
 * Not cryptographic — a real deployment signs the bundle. It is deterministic,
 * which is the property the console needs: two identical libraries produce one
 * bundle id, so "nothing changed" is visible rather than asserted.
 */
function buildBundle(verticalId, objects) {
    const effective = objects
        .filter((o) => isLoadable(o.governance.status))
        .map((o) => `${o.id}@${o.governance.version}`)
        .sort();
    let h = 2166136261;
    for (const s of effective.join("|")) {
        h ^= s.charCodeAt(0);
        h = Math.imul(h, 16777619);
    }
    const hex = (h >>> 0).toString(16).padStart(8, "0");
    return {
        id: `bundle-${verticalId}-${hex}`,
        verticalId,
        objectIds: effective,
        objectCount: effective.length,
    };
}

const $ = (id) => document.getElementById(id);
const esc = (s) =>
  String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const S = {
  reviewer: null,
  workspace: "authority",
  verticalId: "auren",
  panel: "library",
  selected: null,
  libs: Object.fromEntries(VERTICALS.map((v) => [v.id, library(v.id)])),
  reports: {},
  ledger: [],
};

const pack = () => vertical(S.verticalId);
const objects = () => S.libs[S.verticalId] || [];
const report = () => S.reports[S.verticalId] || null;

/* A report describes a library that may no longer exist. Discard it on any
   change rather than show a stale verdict beside changed objects. */
function invalidateReport() {
  delete S.reports[S.verticalId];
}

function advance(id) {
  S.libs[S.verticalId] = objects().map((o) => {
    if (o.id !== id) return o;
    const to = nextStatus(o.governance.status);
    if (!to) return o;
    const roles = o.governance.approverRoles.includes(S.reviewer.role)
      ? o.governance.approverRoles
      : [...o.governance.approverRoles, S.reviewer.role];
    return {
      ...o,
      governance: {
        ...o.governance,
        status: to,
        effectiveDate:
          to === "EFFECTIVE"
            ? new Date().toISOString().slice(0, 10)
            : o.governance.effectiveDate,
        approverRoles: roles,
      },
    };
  });
  invalidateReport();
  render();
}

/* Pioneer's one-step emergency withdrawal. Also the honest way to clear a
   coverage failure: an element nobody can write a question for does not
   belong in the bundle, and retiring it is a decision with a name on it. */
function retire(id) {
  S.libs[S.verticalId] = objects().map((o) =>
    o.id === id ? { ...o, governance: { ...o.governance, status: "RETIRED" } } : o
  );
  invalidateReport();
  render();
}

function runTheGate() {
  S.reports[S.verticalId] = runGate(pack(), objects());
  S.panel = "gate";
  render();
}

function releaseBundle() {
  const r = report();
  if (!r || !r.releasable) return;
  const bundle = buildBundle(S.verticalId, objects());
  S.ledger.unshift({
    bundleId: bundle.id,
    verticalId: S.verticalId,
    approver: `${S.reviewer.name} · ${S.reviewer.role}`,
    at: new Date().toISOString(),
    markets: pack().markets,
    note: `${bundle.objectCount} objects · all hard gates passed`,
    rolledBack: false,
  });
  S.panel = "releases";
  render();
}

function rollback(bundleId) {
  S.ledger = S.ledger.map((e) =>
    e.bundleId === bundleId ? { ...e, rolledBack: true } : e
  );
  render();
}

function statusChip(status) {

    status === "EFFECTIVE" ? "c-effective"
    : status === "APPROVED" ? "c-approved"
    : status === "DRAFT" ? "c-draft"
    : status === "RETIRED" || status === "SUPERSEDED" ? "c-retired"
    : "c-review";
  return `<span class="chip ${cls}">${status.replace(/_/g, " ")}</span>`;
}

function renderSide() {
  const p = pack();
  $("verticalList").innerHTML = VERTICALS.map((v) => `
    <button class="vBtn ${v.id === S.verticalId ? "on" : ""}" data-vertical="${v.id}">

      <span>

  );
}

function detailHtml(o) {
  const to = nextStatus(o.governance.status);
  const at = STATUS_CHAIN.indexOf(o.governance.status);
  const chain = STATUS_CHAIN.map((s, i) => {
    const cls = i < at ? "done" : i === at ? "now" : "";
    return `${i ? '<span class="chainArrow">›</span>' : ""}<span class="chainStep ${cls}">${s.replace(/_/g, " ")}</span>`;
  }).join("");

  let extra = "";
  if (o.kind === "element") {
    extra = `
      <dt>Authority anchor</dt><dd>${esc(o.authorityAnchor) || "— none. Blocks release. —"}</dd>
      <dt>Capturable</dt><dd>${o.capturable ? "Yes" : "No — inferred, never asked. Legitimately unresolvable at intake."}</dd>`;
  } else if (o.kind === "question") {
    extra = `
      <dt>Target element</dt><dd class="mono">${esc(o.targetElement)}</dd>
      <dt>Leading risk</dt><dd>${esc(o.leadingRisk)}${o.leadingRiskRationale ? " — " + esc(o.leadingRiskRationale) : ""}</dd>

      <dt>Distress exit</dt><dd>${o.distressExit ? "Present" : "Absent — blocks release"}</dd>`;
  } else if (o.kind === "boundary") {
    extra = `
      <dt>Refusal</dt><dd>${esc(o.refusalBehaviour)}</dd>
      <dt>Probes</dt><dd>${o.probes.map(esc).join(" · ")}</dd>`;
  } else if (o.kind === "signature" && o.forbiddenPhrasings.length) {
    extra = `<dt>Forbidden phrasings</dt><dd>${o.forbiddenPhrasings.map(esc).join(" · ")}</dd>`;
  }

  return `
    <div class="detail">
      <div>
        <span class="eyebrow">${esc(o.kind)}</span>
        <h3>${esc(o.id)}</h3>
        <div style="font-size:13px;color:var(--ink-3)">${esc(o.label)}</div>
      </div>
      <div class="chain">${chain}</div>
      <dl class="kv">
        <dt>Version</dt><dd class="mono">${esc(o.governance.version)}</dd>
        <dt>Approver roles</dt><dd class="mono">${esc(o.governance.approverRoles.join(", ")) || "— none yet —"}</dd>
        <dt>Source</dt><dd>${esc(o.governance.source)}</dd>
        <dt>Effective date</dt><dd class="mono">${esc(o.governance.effectiveDate || "— not effective —")}</dd>
        <dt>Modes</dt><dd class="mono">${esc(o.eligibility.modes.join(", ")) || "unconstrained"}</dd>
        <dt>Languages</dt><dd class="mono">${esc(o.eligibility.languages.join(", ")) || "unconstrained"}</dd>
        <dt>Markets</dt><dd class="mono">${esc(o.eligibility.markets.join(", ")) || "unconstrained"}</dd>
        ${extra}
      </dl>
      <div class="btnRow">
        <button class="btn" id="advBtn" ${to ? "" : "disabled"}>${to ? "Advance to " + to.replace(/_/g, " ") : "Fully effective"}</button>
        <button class="btn ghost" id="retBtn" ${o.governance.status === "RETIRED" ? "disabled" : ""}>Retire</button>
        <button class="btn ghost" id="closeBtn">Close</button>
      </div>
    </div>`;
}

function libraryPanel() {
  const p = pack();
  const objs = objects();
  const effective = objs.filter((o) => o.governance.status === "EFFECTIVE").length;
  const inReview = objs.filter(
    (o) => o.governance.status !== "EFFECTIVE" && o.governance.status !== "RETIRED"
  ).length;
  const unanchored = objs.filter((o) => o.kind === "element" && !o.authorityAnchor.trim()).length;
  const pendingFid = objs.filter(
    (o) => o.kind === "question" && o.variants.some((v) => v.fidelity !== "passed")
  ).length;

  const sel = S.selected ? objs.find((o) => o.id === S.selected) : null;

  return `
    <div class="pageHead">
      <div>
        <span class="eyebrow">${esc(p.source)}</span>
        <h2>${esc(p.name)} object library</h2>
        <p>${esc(p.programme)}. Objects reach the runtime only at
          <span class="mono">EFFECTIVE</span>; the resolver refuses to load anything else.</p>
      </div>
      <div class="btnRow"><button class="btn" id="gateBtn">Run publish gate</button></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="statN">${effective}</div><div class="statL">Effective — in the bundle</div></div>
      <div class="stat"><div class="statN">${inReview}</div><div class="statL">In review — not released</div></div>
      <div class="stat"><div class="statN">${unanchored}</div><div class="statL">Elements without an anchor</div></div>
      <div class="stat"><div class="statN">${pendingFid}</div><div class="statL">Questions with a pending variant</div></div>
    </div>
    ${sel ? detailHtml(sel) : ""}
    <div class="tw">
      <table>
        <thead><tr><th>Object</th><th>Kind</th><th>Status</th><th>Anchor / source</th><th>Eligibility</th></tr></thead>
        <tbody>
          ${objs.map((o) => `
            <tr>
              <td>
                <button class="rowBtn" data-obj="${esc(o.id)}">${esc(o.id)}</button>
                <div class="mono" style="margin-top:2px">${esc(o.label.length > 74 ? o.label.slice(0, 74) + "…" : o.label)}</div>
              </td>
              <td><span class="kindChip">${esc(o.kind)}</span></td>
              <td>${statusChip(o.governance.status)}</td>
              <td class="mono">${esc(o.kind === "element" ? (o.authorityAnchor || "— none —") : o.governance.source)}</td>
              <td class="mono">${esc(o.eligibility.modes.join(", ") || "any mode")}<br>${esc(o.eligibility.markets.join(", ") || "any market")}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function gatePanel() {
  const p = pack();
  const r = report();
  if (!r) {
    return `
      <div class="pageHead">
        <div>
          <span class="eyebrow">Publish gate</span>
          <h2>${esc(p.name)} release report</h2>
          <p>Ten tests, seven of them blocking. The gate is not a report generated
             after release — it is the condition of release.</p>
        </div>
        <button class="btn" id="gateBtn">Run gate</button>
      </div>
      <div class="empty">No report yet. Run the gate against the current library.</div>`;
  }

  const gates = r.results.map((g) => {
    const m = !g.assessed ? ["n/a", "m-na"]
      : g.passed ? ["pass", "m-pass"]
      : g.severity === "hard" ? ["blocked", "m-hard"] : ["advisory", "m-adv"];
    const findings = g.findings.length
      ? `<div class="findings">${g.findings.map((f) => `
          <div class="finding"><span class="fSubject">${esc(f.subject)}</span><span>${esc(f.detail)}</span></div>`).join("")}</div>`
      : "";
    return `
      <div class="gate">
        <div class="gateHead">
          <span class="gateMark ${m[1]}">${m[0]}</span>
          <span><span class="gateName">${esc(g.name)}</span><span class="gateAsserts">${esc(g.asserts)}</span></span>
          <span class="gateCount">${g.assessed ? g.checked + " checked" : "not assessed"}</span>
        </div>
        ${findings}
      </div>`;
  }).join("");

  return `
    <div class="pageHead">
      <div>
        <span class="eyebrow">Publish gate · ${new Date(r.generatedAt).toLocaleString()}</span>
        <h2>${esc(p.name)} release report</h2>
      </div>
      <div class="btnRow">
        <button class="btn ghost" id="gateBtn">Re-run</button>
        <button class="btn" id="relBtn" ${r.releasable ? "" : "disabled"}>Release bundle</button>
      </div>
    </div>
    <div class="verdictBar ${r.releasable ? "ok" : ""}">
      <span class="verdictText">${r.releasable ? "Releasable." : "Blocked."}</span>
      <span class="mono">${r.effectiveCount}/${r.totalCount} effective · ${r.hardFailures} hard · ${r.advisoryFailures} advisory</span>
      <span class="verdictSub">${r.releasable
        ? "Every hard gate passed. Advisory findings do not block, and they do not disappear either."
        : "A hard gate failed. There is no waive path — for BYOND either, by design."}</span>
    </div>
    <div class="gateList">${gates}</div>`;
}

function ledgerPanel() {
  const rows = S.ledger.filter((e) => e.verticalId === S.verticalId);
  return `
    <div class="pageHead">
      <div>
        <span class="eyebrow">Append-only</span>
        <h2>Release ledger</h2>
        <p>The object register carries roles; this ledger carries names. Both
           papers get the export they need without either compromising.</p>
      </div>
    </div>
    ${rows.length === 0
      ? `<div class="empty">No releases yet. A bundle appears here the moment one is signed.</div>`
      : `<div class="tw"><table>
          <thead><tr><th>Bundle</th><th>Approver</th><th>Markets</th><th>Signed</th><th></th></tr></thead>
          <tbody>${rows.map((e) => `
            <tr>
              <td><span class="mono">${esc(e.bundleId)}</span><div class="statL">${esc(e.note)}</div></td>
              <td>${esc(e.approver)}</td>
              <td class="mono">${esc(e.markets.join(", "))}</td>
              <td class="mono">${new Date(e.at).toLocaleString()}</td>
              <td>${e.rolledBack
                ? `<span class="chip c-retired">rolled back</span>`
                : `<button class="btn ghost" data-rollback="${esc(e.bundleId)}">Roll back</button>`}</td>
            </tr>`).join("")}</tbody></table></div>`}`;
}

function operationsPanel() {
  const p = pack();
  return `
    <div class="pageHead">
      <div>
        <span class="eyebrow">Separate workspace</span>
        <h2>${esc(p.name)} operations</h2>
        <p>Records, cohort analytics and remediation queues over the
           ${esc(p.outputObject)}. Tenant-isolated, and never linked across tenants.</p>
      </div>
    </div>
    <div class="note">
      <b>Deliberately separate from governance, and deliberately empty here.</b>
      Operations reads the data plane — sessions, records, evidence — which is
      tenant-isolated and jurisdiction-resident. The governance workspace reads
      the knowledge plane, which holds no personal data at all and is what ships
      to a sovereign environment as a signed bundle. An error in this workspace
      is an inconvenience; an error in the one next door is a regulatory event.
      They do not share a screen, an undo history or a permission set.
    </div>`;
}

function render() {
  renderSide();
  const main = $("main");
  main.innerHTML =
    S.workspace === "operations" ? operationsPanel()
    : S.panel === "library" ? libraryPanel()
    : S.panel === "gate" ? gatePanel()
    : ledgerPanel();

  const gateBtn = $("gateBtn");
  if (gateBtn) gateBtn.onclick = runTheGate;
  const relBtn = $("relBtn");
  if (relBtn) relBtn.onclick = releaseBundle;
  const advBtn = $("advBtn");
  if (advBtn) advBtn.onclick = () => advance(S.selected);
  const retBtn = $("retBtn");
  if (retBtn) retBtn.onclick = () => retire(S.selected);
  const closeBtn = $("closeBtn");
  if (closeBtn) closeBtn.onclick = () => { S.selected = null; render(); };

  main.querySelectorAll("[data-obj]").forEach((b) => {
    b.onclick = () => { S.selected = b.dataset.obj; render(); window.scrollTo({ top: 0 }); };
  });
  main.querySelectorAll("[data-rollback]").forEach((b) => {
    b.onclick = () => rollback(b.dataset.rollback);
  });
}

/* ── Wiring ────────────────────────────────────────────────────────── */

$("enterBtn").onclick = () => {
  S.reviewer = { name: ($("nm").value || "Reviewer").trim(), role: $("rl").value };
  $("whoName").textContent = S.reviewer.name;
  $("whoRole").textContent = S.reviewer.role;
  $("signin").classList.add("hidden");
  $("shell").classList.remove("hidden");
  render();
};

$("signOut").onclick = () => {
  S.reviewer = null;
  $("shell").classList.add("hidden");
  $("signin").classList.remove("hidden");
};

document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-vertical]");
  if (v) { S.verticalId = v.dataset.vertical; S.selected = null; S.panel = "library"; render(); return; }
  const n = e.target.closest("[data-panel]");
  if (n) { S.panel = n.dataset.panel; render(); return; }
  const w = e.target.closest("[data-ws]");
  if (w) { S.workspace = w.dataset.ws; render(); }
});
</script>
</body>
</html>
